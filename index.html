<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NIELLSTORE Mini App</title>
  <!-- SDK TELEGRAM WEB APP -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121318; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 380px; }
    .card { background-color: #1a1c23; border: 1px solid #2a2d37; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    
    .profile-box { background-color: #252833; padding: 14px; border-radius: 12px; margin-bottom: 16px; border-left: 4px solid #e57c00; }
    .profile-box h3 { font-size: 1rem; color: #e57c00; }
    .profile-box p { font-size: 0.8rem; color: #9aa0a6; margin-top: 2px; }
    
    .menu-card { background-color: #252833; border: 1px solid #2a2d37; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .menu-card h4 { font-size: 0.85rem; color: #e57c00; margin-bottom: 10px; }
    
    .form-group { text-align: left; margin-bottom: 12px; }
    label { display: block; font-size: 0.68rem; font-weight: 700; color: #9aa0a6; margin-bottom: 6px; text-transform: uppercase; }
    input, select { width: 100%; padding: 12px; background-color: #121318; border: 1px solid #2a2d37; border-radius: 8px; color: #ffffff; font-size: 0.85rem; outline: none; }
    input:focus, select:focus { border-color: #e57c00; }

    .btn-submit { width: 100%; padding: 12px; background-color: #e57c00; border: none; border-radius: 8px; color: #121318; font-size: 0.85rem; font-weight: 800; cursor: pointer; text-transform: uppercase; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-topup { background-color: #34a853; color: #ffffff; }

    .status-msg { margin-top: 10px; font-size: 0.78rem; color: #ea4335; text-align: center; min-height: 16px; word-break: break-all; }
    .status-msg.success { color: #34a853; }
    
    /* Loading Bar Incremental */
    .loader { display: none; margin-top: 10px; text-align: center; font-size: 0.8rem; color: #9aa0a6; }
    .bar-bg { width: 100%; height: 6px; background: #121318; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .bar-fill { width: 0%; height: 100%; background: #e57c00; transition: width 0.05s linear; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2 style="text-align: center; font-size: 1.1rem; margin-bottom: 14px;">NIELLSTORE PORTAL</h2>

      <!-- BOX PROFIL TELEGRAM -->
      <div class="profile-box">
        <h3 id="userNama">Memuat Profil...</h3>
        <p id="userTeleId">ID: -</p>
        <p style="margin-top: 6px; font-weight: bold; color: #fff;">Saldo: <span id="userSaldo" style="color: #34a853;">Rp 0</span></p>
      </div>

      <!-- ANIMASI LOADING -->
      <div class="loader" id="loader">
        <span>Menghubungkan ke Server... <b id="percent">0%</b></span>
        <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
      </div>

      <!-- KONTEN UTAMA -->
      <div id="mainContent" style="display: none;">
        <!-- PRODUK FREE FIRE - PHANTOM -->
        <div class="menu-card">
          <h4>🔥 Free Fire - Phantom</h4>
          <div class="form-group">
            <label>Pilih Durasi Key</label>
            <select id="durasiSelect">
              <option value="Phantom 3 Jam|4000">Phantom - 3 Jam (Rp 4.000)</option>
              <option value="Phantom 6 Jam|7500">Phantom - 6 Jam (Rp 7.500)</option>
              <option value="Phantom 12 Jam|9500">Phantom - 12 Jam (Rp 9.500)</option>
              <option value="Phantom 1 Day|11000">Phantom - 1 Day (Rp 11.000)</option>
              <option value="Phantom 3 Day|20000">Phantom - 3 Day (Rp 20.000)</option>
              <option value="Phantom 7 Day|35000">Phantom - 7 Day (Rp 35.000)</option>
              <option value="Phantom 30 Day|80000">Phantom - 30 Day (Rp 80.000)</option>
            </select>
          </div>
          <button class="btn-submit" onclick="beliProduk()">Beli Sekarang</button>
          <div class="status-msg" id="buyMsg"></div>
        </div>

        <!-- TOP UP SALDO MANUAL -->
        <div class="menu-card">
          <h4>💰 Top Up Saldo Manual</h4>
          <div class="form-group">
            <label>Jumlah Nominal (Min. Rp 15.000)</label>
            <input type="number" id="topupAmount" placeholder="15000" min="15000" />
          </div>
          <button class="btn-submit btn-topup" onclick="requestTopUp()">Request Top Up</button>
          <div class="status-msg" id="topupMsg"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6JxGXI6ZFsuHt-QKVJ_YUbVZhgNGjFxUdY4eCS1hoImK7z4qxLUqJTkSy5qNQfJ3Byw/exec";
    
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    let userData = {
      teleId: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "12345678",
      nama: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.first_name + " " + (tg.initDataUnsafe.user.last_name || "")).trim() : "Reseller Demo",
      username: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.username : "-",
      saldo: 0
    };

    // Auto Init saat buka Web App
    window.onload = function() {
      runProgress(100, () => {
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'init_user', teleId: userData.teleId, nama: userData.nama, username: userData.username })
        })
        .then(res => res.json())
        .then(data => {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('mainContent').style.display = 'block';

          if (data.status === 'success') {
            userData.saldo = data.user.saldo;
            document.getElementById('userNama').innerText = data.user.nama;
            document.getElementById('userTeleId').innerText = "ID: " + data.user.teleId + (data.user.username ? " (@" + data.user.username + ")" : "");
            updateSaldoUI(data.user.saldo);
          }
        })
        .catch(() => {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('userNama').innerText = "Gagal terhubung server";
        });
      });
    };

    function runProgress(target, callback) {
      const loader = document.getElementById('loader');
      const bar = document.getElementById('bar');
      const percent = document.getElementById('percent');
      loader.style.display = 'block';

      let p = 0;
      const interval = setInterval(() => {
        p += Math.floor(Math.random() * 8) + 2;
        if (p >= target) {
          p = target;
          clearInterval(interval);
          if (callback) callback();
        }
        bar.style.width = p + '%';
        percent.innerText = p + '%';
      }, 40);
    }

    function updateSaldoUI(saldo) {
      userData.saldo = saldo;
      document.getElementById('userSaldo').innerText = 'Rp ' + Number(saldo).toLocaleString('id-ID');
    }

    function beliProduk() {
      const select = document.getElementById('durasiSelect').value.split('|');
      const durasi = select[0];
      const harga = Number(select[1]);
      const msg = document.getElementById('buyMsg');

      if (userData.saldo < harga) {
        msg.className = 'status-msg';
        msg.innerText = 'Saldo tidak cukup!';
        return;
      }

      msg.innerText = 'Memproses...';

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'buy', teleId: userData.teleId, durasi: durasi, harga: harga })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          msg.className = 'status-msg success';
          msg.innerText = `Sukses! Key: ${data.serialKey}`;
          updateSaldoUI(data.sisaSaldo);
        } else {
          msg.className = 'status-msg';
          msg.innerText = data.message;
        }
      });
    }

    function requestTopUp() {
      const amount = document.getElementById('topupAmount').value;
      const msg = document.getElementById('topupMsg');

      if (!amount || amount < 15000) {
        msg.className = 'status-msg';
        msg.innerText = 'Minimal top up Rp 15.000!';
        return;
      }

      msg.innerText = 'Mengirim request...';

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'topup', teleId: userData.teleId, nama: userData.nama, jumlah: amount })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          msg.className = 'status-msg success';
          msg.innerText = `Req #${data.depositId} dibuat. Silakan transfer Rp ${Number(amount).toLocaleString('id-ID')} ke Admin.`;
        } else {
          msg.className = 'status-msg';
          msg.innerText = data.message;
        }
      });
    }
  </script>
</body>
</html>
