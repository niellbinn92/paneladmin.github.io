<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NIELLSTORE - Login Reseller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121318;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
    }

    .card {
      background-color: #1a1c23;
      border: 1px solid #2a2d37;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background-color: #e57c00;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 12px rgba(229, 124, 0, 0.3);
    }

    .icon-box svg {
      width: 28px;
      height: 28px;
      fill: #121318;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #9aa0a6;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #9aa0a6;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background-color: #121318;
      border: 1px solid #2a2d37;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #e57c00;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #e57c00;
      border: none;
      border-radius: 10px;
      color: #121318;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #ea4335;
      min-height: 20px;
    }

    .status-msg.success {
      color: #34a853;
    }

    .loader-container {
      display: none;
      margin-top: 15px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #121318;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #e57c00;
      transition: width 0.05s linear;
    }

    .progress-text {
      font-size: 0.8rem;
      color: #9aa0a6;
      font-weight: 600;
    }

    #dashboard-view {
      display: none;
      text-align: left;
    }

    .dashboard-header {
      background-color: #252833;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .dashboard-header p {
      font-size: 0.85rem;
      color: #9aa0a6;
      margin-top: 4px;
    }

    .btn-logout {
      background-color: #333644;
      color: #fff;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- FORM LOGIN -->
    <div class="card" id="login-card">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>

      <h2>LOGIN RESELLER</h2>
      <p class="subtitle">Masukkan Email dan Password yang diberikan oleh Admin.</p>

      <form id="loginForm">
        <div class="form-group">
          <label>EMAIL RESELLER</label>
          <input type="email" id="email" placeholder="nama@gmail.com" required autocomplete="off" />
        </div>

        <div class="form-group">
          <label>PASSWORD / PIN</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">MASUK PORTAL</button>
      </form>

      <!-- Loading Animasi 1-100% -->
      <div class="loader-container" id="loaderContainer">
        <span class="progress-text">Memvalidasi Data... <span id="percentText">0%</span></span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div class="card" id="dashboard-view">
      <h2>SELAMAT DATANG</h2>
      <div class="dashboard-header">
        <h3 id="resellerName" style="color: #e57c00;">-</h3>
        <p id="resellerEmail">-</p>
        <p style="margin-top: 10px; color: #fff; font-weight: bold;">Saldo: <span id="resellerSaldo" style="color: #34a853;">-</span></p>
      </div>
      <button class="btn-logout" onclick="logout()">KELUAR PORTAL</button>
    </div>
  </div>

  <script>
    // URL Web App Google Sheets Kamu
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6JxGXI6ZFsuHt-QKVJ_YUbVZhgNGjFxUdY4eCS1hoImK7z4qxLUqJTkSy5qNQfJ3Byw/exec";

    const loginForm = document.getElementById('loginForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const loaderContainer = document.getElementById('loaderContainer');
    const progressBar = document.getElementById('progressBar');
    const percentText = document.getElementById('percentText');
    const statusMsg = document.getElementById('statusMsg');

    const loginCard = document.getElementById('login-card');
    const dashboardView = document.getElementById('dashboard-view');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      statusMsg.className = 'status-msg';
      statusMsg.innerText = '';
      btnSubmit.disabled = true;
      loaderContainer.style.display = 'block';

      let progress = 0;
      let targetProgress = 90;
      
      const interval = setInterval(() => {
        if (progress < targetProgress) {
          progress += Math.floor(Math.random() * 5) + 1;
          if (progress > targetProgress) progress = targetProgress;
          updateProgress(progress);
        }
      }, 50);

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(res => res.json())
      .then(data => {
        targetProgress = 100;
        clearInterval(interval);
        updateProgress(100);

        setTimeout(() => {
          loaderContainer.style.display = 'none';
          btnSubmit.disabled = false;

          if (data.status === 'success') {
            statusMsg.className = 'status-msg success';
            statusMsg.innerText = 'Login Berhasil!';
            
            setTimeout(() => {
              loginCard.style.display = 'none';
              dashboardView.style.display = 'block';
              document.getElementById('resellerName').innerText = data.user.nama || 'Reseller';
              document.getElementById('resellerEmail').innerText = data.user.email;
              document.getElementById('resellerSaldo').innerText = data.user.saldo ? 'Rp ' + Number(data.user.saldo).toLocaleString('id-ID') : 'Rp 0';
            }, 500);

          } else {
            statusMsg.innerText = data.message || 'Email atau Password salah!';
          }
        }, 300);
      })
      .catch(err => {
        clearInterval(interval);
        loaderContainer.style.display = 'none';
        btnSubmit.disabled = false;
        statusMsg.innerText = 'Error jaringan. Periksa koneksi kamu.';
      });
    });

    function updateProgress(val) {
      progressBar.style.width = val + '%';
      percentText.innerText = val + '%';
    }

    function logout() {
      dashboardView.style.display = 'none';
      loginCard.style.display = 'block';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      statusMsg.innerText = '';
      updateProgress(0);
    }
  </script>
</body>
</html>
